<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<link rel="stylesheet" href="xterm.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg, #1e1e1e); }
  #term { position: absolute; inset: 0; padding: 6px 0 0 8px; }
  /* 스크롤바는 항상 자리를 잡는다. auto면 스크롤백이 생기는 순간 폭이 줄어 fit이 열 수를 바꾸고,
     ConPTY가 화면을 다시 그려 같은 줄이 두 번 쌓인다(치명적 버그였다) */
  .xterm .xterm-viewport { overflow-y: scroll; }
  .xterm .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(128,128,128,.35); border-radius: 5px; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-search.js"></script>
<script>
// 앱(WinUI)과의 브리지. 앱 → 페이지: {type:'out'|'paste'|'theme'|'focus'|'fit'|'reset'|'find'|'find-clear', ...}, 페이지 → 앱: {type:'in'|'resize'|'copy'|'paste'|'ready'|'title'|'drop-files'}
// 출력은 base64 UTF-8 바이트다. 글자 중간에서 잘린 덩어리는 xterm이 이어 붙여 해석한다.
(function () {
  var host = window.chrome && window.chrome.webview;
  var post = function (msg) { if (host) host.postMessage(msg); };

  var term = new Terminal({
    allowProposedApi: true,
    cursorBlink: true,
    fontFamily: 'Cascadia Mono, Consolas, "D2Coding", monospace',
    fontSize: 14,
    lineHeight: 1.15,
    scrollback: 5000,
    convertEol: false,
    windowsPty: { backend: 'conpty' }
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  var search = new SearchAddon.SearchAddon();
  term.loadAddon(search);
  term.open(document.getElementById('term'));

  var searchOptions = { decorations: { matchOverviewRuler: '#f0c000', activeMatchColorOverviewRuler: '#ff8800' } };

  // 키: 선택이 있으면 Ctrl+C는 복사, 없으면 프로세스로. Ctrl+V·Shift+Insert는 앱이 클립보드를 읽어 보낸다.
  // Ctrl+F는 앱의 찾기 줄을 연다 — 앱 단축키는 WebView2 가 포커스를 잡으면 안 닿으므로 이 길뿐이다.
  // 앱 단축키(Ctrl+1~7·F5)는 여기서 먹어서 브라우저·앱 어느 쪽도 처리하지 않게 한다.
  term.attachCustomKeyEventHandler(function (e) {
    if (e.type !== 'keydown') return true;
    var ctrl = e.ctrlKey && !e.altKey;
    if (ctrl && (e.key === 'c' || e.key === 'C') && term.hasSelection()) {
      post({ type: 'copy', text: term.getSelection() });
      term.clearSelection();
      return false;
    }
    if ((ctrl && (e.key === 'v' || e.key === 'V')) || (e.shiftKey && e.key === 'Insert')) {
      post({ type: 'paste' });
      return false;
    }
    if (ctrl && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
      if (term.hasSelection()) post({ type: 'copy', text: term.getSelection() });
      return false;
    }
    // 글자 크기: Ctrl + / - / 0. 앱이 설정을 바꿔 테마로 되돌려 준다(그래야 다음에도 그 크기다)
    if (ctrl && (e.key === '=' || e.key === '+' || e.key === '-' || e.key === '_' || e.key === '0')) {
      e.preventDefault();
      post({ type: 'zoom', step: e.key === '0' ? 0 : ((e.key === '-' || e.key === '_') ? -1 : 1) });
      return false;
    }
    // 찾기: WebView2 가 포커스를 잡고 있어 앱의 단축키가 안 닿는다. 여기서 먹어서 앱에 알린다
    if (ctrl && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      post({ type: 'find' });
      return false;
    }
    if (e.key === 'F5' || (ctrl && /^[1-9]$/.test(e.key))) {
      e.preventDefault();
      return false;
    }
    return true;
  });

  // Ctrl+휠: 글자 크기. 키 핸들러와 짝인 정식 훅이라 xterm 이 스크롤로 쓰기 전에 먼저 온다.
  // document 에 걸면 오지 않는다 — 뷰포트가 휠을 먼저 먹기 때문이다(2026-09-10 실측).
  term.attachCustomWheelEventHandler(function (e) {
    if (!e.ctrlKey) return true;
    post({ type: 'zoom', step: e.deltaY < 0 ? 1 : -1 });
    return false;
  });

  // 오른쪽 클릭: 선택이 있으면 복사, 없으면 붙이기
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    if (term.hasSelection()) { post({ type: 'copy', text: term.getSelection() }); term.clearSelection(); }
    else post({ type: 'paste' });
  });

  // 파일 끌어놓기: 브라우저는 파일의 이름만 알지만 WebView2 는 File 객체를 함께 보내면 앱 쪽에서 전체 경로를 준다
  // (postMessageWithAdditionalObjects → CoreWebView2File.Path). 앱이 경로를 따옴표로 감싸 붙여 넣는다. 기본 동작(파일로 이동)은 막는다
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    var files = e.dataTransfer && e.dataTransfer.files;
    if (!host || !files || files.length === 0 || !host.postMessageWithAdditionalObjects) return;
    var list = [];
    for (var i = 0; i < files.length; i++) list.push(files[i]);
    host.postMessageWithAdditionalObjects({ type: 'drop-files', count: list.length }, list);
    term.focus();
  });

  term.onData(function (d) { post({ type: 'in', data: d }); });
  term.onBinary(function (d) { post({ type: 'in', data: d }); });
  term.onResize(function (s) { post({ type: 'resize', cols: s.cols, rows: s.rows }); });
  term.onTitleChange(function (t) { post({ type: 'title', title: t }); });

  function b64ToBytes(b64) {
    var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // 스크롤백까지 포함한 화면 글자. 오른쪽 빈칸은 지운다
  function dumpText() {
    try {
      var buf = term.buffer.active;
      var lines = [];
      for (var i = 0; i < buf.length; i++) {
        var line = buf.getLine(i);
        lines.push(line ? line.translateToString(true) : '');
      }
      while (lines.length > 0 && lines[lines.length - 1] === '') lines.pop();
      return lines.join('\n');
    } catch (err) {
      return '';
    }
  }

  function applyTheme(t) {
    document.documentElement.style.setProperty('--bg', t.background);
    term.options.theme = t;
    if (t.fontSize) term.options.fontSize = t.fontSize;
    doFit();
  }

  var fitTimer = null;
  function doFit() {
    try { fit.fit(); } catch (err) { /* 아직 크기가 없다 */ }
  }
  new ResizeObserver(function () {
    if (fitTimer) clearTimeout(fitTimer);
    fitTimer = setTimeout(doFit, 40);
  }).observe(document.getElementById('term'));

  if (host) {
    host.addEventListener('message', function (ev) {
      var m = ev.data;
      if (!m || !m.type) return;
      switch (m.type) {
        case 'out': term.write(b64ToBytes(m.data)); break;
        case 'paste': term.paste(m.text || ''); break;   // bracketed paste 모드면 xterm이 감싼다
        case 'theme': applyTheme(m.theme); break;
        case 'focus': term.focus(); break;
        case 'fit': doFit(); break;
        // reset: 다른 방으로 바꿀 때. clear()는 현재 줄과 대체 화면·bracketed paste 같은 모드를 남겨 옛 방 상태 위에 새 방이 그려진다
        case 'reset': term.reset(); break;
        case 'find': try { if (m.dir === 'prev') search.findPrevious(m.query || '', searchOptions); else search.findNext(m.query || '', searchOptions); } catch (err) {} break;
        case 'find-clear': try { search.clearDecorations(); } catch (err) {} break;
        // 화면 그대로 내놓기. ANSI 코드가 아니라 xterm 이 그린 글자를 준다 — 붙여넣어 물어보기에 그편이 낫다
        case 'dump': post({ type: 'dump-result', text: dumpText() }); break;
      }
    });
  }

  doFit();
  post({ type: 'ready', cols: term.cols, rows: term.rows });
})();
</script>
</body>
</html>
