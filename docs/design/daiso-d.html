<style>
/* 레이아웃: 위 줄에서 프로젝트를 고르면 왼쪽 탭 여섯 개가 모두 그 프로젝트 기준이 된다. 터미널 현황은 종, 계정은 그 옆, 설정은 톱니. 제목 줄에는 이름과 상태만, 설명은 툴팁. 저장·삭제 같은 확정 버튼은 늘 아래 같은 자리. 고른 것은 형광펜 노랑 */
:root {

  --t-xl: 1.5rem;
}

  :root:not([data-theme="light"]) {
    --ground: #121411; --surface: #191c18; --raise: #20241f; --line: #30352e; --line-soft: #272b25;
    --ink: #eceee8; --muted: #a2a99f; --faint: #737a70;
    --hl: #e9bd38; --hl-soft: #3a3320; --hl-ink: #181a15;
    --term-bg: #0f110e; --term-fg: #dfe3da; --term-dim: #737a70;
    --codex: #4bb398; --claude: #e08a5c; --anti: #a287e0;

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #121411; --surface: #191c18; --raise: #20241f; --line: #30352e; --line-soft: #272b25;
  --ink: #eceee8; --muted: #a2a99f; --faint: #737a70;
  --hl: #e9bd38; --hl-soft: #3a3320; --hl-ink: #181a15;
  --term-bg: #0f110e; --term-fg: #dfe3da; --term-dim: #737a70;
  --codex: #4bb398; --claude: #e08a5c; --anti: #a287e0;
  --ok: #5cbb7e; --warn: #dcaa3c; --bad: #e66a52;

}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-ui); font-size: var(--t-sm); line-height: 1.5; margin: 0; padding: 24px 20px 40px; }

.num { font-variant-numeric: tabular-nums; }

.faint { color: var(--faint); }
.i { width: 1em; height: 1em; fill: currentColor; flex: none; vertical-align: -.125em; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* 메모 */
.memo { max-width: 1280px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 24px; }

/* 공용 */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 99px; background: var(--ground); border: 1px solid var(--line); flex: none; }
.seg button { border: 0; background: transparent; border-radius: 99px; padding: 3px 12px; color: var(--muted); font-size: var(--t-xs); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 99px; padding: 6px 13px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.small { padding: 3px 10px; font-size: var(--t-xs); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--ink); background: var(--raise); border-color: var(--line); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { border: 1px solid transparent; background: transparent; border-radius: 8px; width: 32px; height: 32px; display: inline-grid; place-items: center; color: var(--muted); flex: none; font-size: 15px; }
.icon-btn:hover { background: var(--raise); border-color: var(--line); color: var(--ink); }
.icon-btn[aria-pressed="true"] { background: var(--hl); color: var(--hl-ink); }
.icon-btn[disabled] { visibility: hidden; }
.chip { border: 1px solid var(--line); background: var(--raise); border-radius: 99px; padding: 4px 12px; font-weight: 600; font-size: var(--t-xs); display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.card { background: var(--raise); border: 1px solid var(--line-soft); border-radius: 14px; }
.input, .select { border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 6px 11px; min-width: 0; width: 100%; }
.select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 15px center, right 10px center; background-size: 5px 5px; background-repeat: no-repeat; }
.input:focus, .select:focus { border-color: var(--ink); outline: none; }
.lbl-row { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: center; }
.lbl-row > label, .lbl-row > span:first-child { color: var(--muted); font-weight: 600; font-size: var(--t-xs); }
.pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 17%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.pill.plain { background: var(--ground); color: var(--muted); }
.tool { width: 22px; height: 22px; border-radius: 7px; display: inline-grid; place-items: center; font: 700 11px/1 var(--f-mono); color: #fff; flex: none; position: relative; }
.tool.sm { width: 18px; height: 18px; border-radius: 5px; font-size: 10px; }
.tool.lg { width: 36px; height: 36px; border-radius: 10px; font-size: 15px; }
.tool.codex { background: var(--codex); } .tool.claude { background: var(--claude); } .tool.anti { background: var(--anti); }
.tool .st { position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--raise); }
.st.ok, .dot.ok { background: var(--ok); } .st.warn, .dot.warn { background: var(--warn); } .st.bad, .dot.bad { background: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 220px; }
.pop.right { left: auto; right: 0; }
.anchor { position: relative; display: inline-flex; }

.menu-item small { margin-left: auto; color: var(--faint); font-size: var(--t-xs); }
.menu-sep { height: 1px; background: var(--line-soft); margin: 4px 6px; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* 창 */
.window { max-width: 1280px; height: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 196px minmax(0, 1fr); overflow: hidden; position: relative; }

.logo i { width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 700 11px/1 var(--f-title); font-style: normal; }
.menu { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.menu button { width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 10px; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; text-align: left; font-weight: 500; color: var(--muted); font-size: var(--t-sm); }
.menu button .i { font-size: 16px; }

.menu .new { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.main { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; container-type: inline-size; }
.page { min-height: 0; overflow: auto; padding: 20px 26px 28px; display: flex; flex-direction: column; gap: 16px; }
.page.fixed { overflow: hidden; padding: 0; gap: 0; display: grid; }
.phead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.phead h2 { font: 700 var(--t-xl)/1.2 var(--f-title); margin: 0; letter-spacing: -.01em; }
.phead .state { color: var(--faint); font-size: var(--t-xs); font-weight: 600; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.statusbar { display: flex; align-items: center; gap: 12px; padding: 6px 16px; border-top: 1px solid var(--line); font-size: var(--t-xs); color: var(--muted); background: var(--surface); }
.statusbar.err { color: var(--bad); }
.statusbar .bar { width: 160px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-left: auto; }
.statusbar .bar span { display: block; height: 100%; width: 40%; background: var(--ink); border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 20px; border-top: 1px solid var(--line); background: var(--surface); }

/* 요약 */
.strip-wrap { position: relative; }
.strip { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 100%; gap: 14px; overflow-x: auto; scroll-behavior: smooth; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px 25%; }
.strip .tcard { scroll-snap-align: center; transition: opacity .2s, transform .2s; }
.strip .tcard:not(.center) { opacity: .5; transform: scale(.97); }
.strip .tcard:not(.center):hover { opacity: .8; }
@media (prefers-reduced-motion: reduce) { .strip { scroll-behavior: auto; } .strip .tcard { transition: none; } }
.strip::-webkit-scrollbar { display: none; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); box-shadow: var(--shadow); display: grid; place-items: center; z-index: 3; }
.arrow.l { left: calc(25% - 22px); } .arrow.r { right: calc(25% - 22px); }
.tcard { min-width: 0; text-align: left; cursor: pointer; border: 1px solid var(--line-soft); background: var(--raise); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tcard:focus-within, .tcard:hover { border-color: var(--line); }

.tcard-top .pill { margin-left: auto; }
.lines { display: flex; flex-direction: column; gap: 3px; }
.lines div { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); }
.lines div:first-child { color: var(--ink); font-weight: 600; }

.tcard-acts { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
.acct-pop { width: 420px; max-width: calc(100vw - 80px); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.acct-pop p { margin: 0; color: var(--muted); font-size: var(--t-xs); }
.prof { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 8px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--line-soft); }

.extra-pop { width: 380px; max-width: calc(100vw - 80px); max-height: 300px; overflow: auto; padding: 10px 12px; }

.sum2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.box { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }

.link { border: 0; background: transparent; padding: 0; color: var(--ink); font-weight: 600; font-size: var(--t-xs); text-decoration: underline; text-decoration-color: var(--hl); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.rrow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 10px; cursor: context-menu; }
.rrow:hover { background: var(--surface); }

.ctx-menu { position: absolute; z-index: 40; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats3 div span { display: block; color: var(--faint); font-size: var(--t-xs); font-weight: 600; }
.stats3 div b { font: 700 1.35rem/1.2 var(--f-title); }

/* 사용량 */
.cost { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 16px 18px; }

.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }

/* 터미널 */
.term-page { grid-template-rows: auto minmax(0, 1fr); }

.room .name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.room[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); color: var(--hl-ink); }

.toolcall { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-soft); background: var(--raise); border-radius: 10px; padding: 4px 10px; font: 400 12px var(--f-mono); color: var(--muted); align-self: flex-start; }
.toolcall .ok { color: var(--ok); } .toolcall .add { color: var(--ok); }

.cmdpop { position: absolute; left: 16px; right: 16px; bottom: calc(100% - 4px); max-width: 620px; background: var(--raise); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; max-height: 340px; overflow: auto; z-index: 10; }

.cmd { width: 100%; border: 0; background: transparent; text-align: left; border-radius: 10px; padding: 7px 10px; display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 10px; align-items: baseline; }
.cmd.on, .cmd:hover { background: var(--hl-soft); }
.cmd b { font: 600 13px var(--f-mono); white-space: nowrap; }

.term { background: var(--term-bg); color: var(--term-fg); min-height: 0; display: flex; position: relative; }
.term pre { margin: 0; padding: 18px 22px; font: 400 13px/1.7 var(--f-mono); overflow: auto; white-space: pre-wrap; word-break: break-word; flex: 1; }
.term .d { color: var(--term-dim); } .term .c { color: var(--claude); } .term .x { color: var(--codex); }
.term .g { color: #7fcf8f; } .term .y { color: #ebc35a; } .term .u { color: #a6c2ff; } .term .q { background: #3b3410; color: #ffe08a; }
.caret { display: inline-block; width: .6em; background: var(--term-fg); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

/* 새 터미널 */
.nt { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.nt-steps { overflow: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 6px; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; }
.step.later { opacity: .4; }
.step .mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; border: 1.5px solid var(--line); color: var(--faint); background: var(--raise); margin-top: 1px; }
.step.done .mark { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.step.now .mark { border-color: var(--ink); color: var(--ink); box-shadow: 0 0 0 3px var(--hl); }
.step h4 { margin: 0; font-size: var(--t-md); height: 26px; display: flex; align-items: center; gap: 8px; }
.step h4 small { color: var(--faint); font-weight: 600; font-size: var(--t-xs); }
.step .sbody { grid-column: 2; display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
.tools3 { display: flex; flex-wrap: wrap; gap: 8px; }
.toolpick { width: 150px; border: 1.5px solid var(--line); background: var(--raise); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.toolpick[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--hl); }
.toolpick small { color: var(--faint); font-size: var(--t-xs); }
.toolpick .miss { color: var(--warn); }
.picker { position: relative; width: 100%; }
.picker > button { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 7px 11px; }
.picker > button .ph { color: var(--faint); }
.picker > button .i:last-child { margin-left: auto; color: var(--faint); }
.picker .pop { left: 0; right: 0; padding: 6px; }
.picker .plist { max-height: 200px; overflow: auto; margin-top: 6px; }
.prow { width: 100%; border: 0; background: transparent; text-align: left; border-radius: 8px; padding: 6px 9px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; }
.prow:hover, .prow[aria-selected="true"] { background: var(--hl-soft); }
.prow small { color: var(--faint); font-size: var(--t-xs); white-space: nowrap; }

.with-btn { display: flex; gap: 6px; }
.nt-foot { border-top: 1px solid var(--line); background: var(--raise); padding: 12px 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; }
.nt-foot .sentence { font-weight: 600; }
.nt-foot .left-hint { color: var(--warn); font-weight: 600; }
.cmdline { display: flex; align-items: center; gap: 8px; grid-column: 1; min-width: 0; }
.cmdline code { font: 12px var(--f-mono); background: var(--term-bg); color: var(--term-fg); border-radius: 8px; padding: 5px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nt-foot .go { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 8px; }

/* 세션 */
.sess-page { grid-template-rows: auto minmax(0, 1fr) auto; }
.sess-top { padding: 18px 22px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }

.searchbox .wrap { position: relative; flex: 1; min-width: 0; }

.split { display: grid; grid-template-columns: 360px minmax(0, 1fr); min-height: 0; }

.centered { display: grid; place-items: center; color: var(--muted); padding: 40px; text-align: center; }

/* 지침 · 프롬프트 */
.ed-page { grid-template-rows: auto minmax(0, 1fr) auto; }
.ed-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.ed-top h2 { font: 700 var(--t-xl)/1.2 var(--f-title); margin: 0; }
.ed-top .acts { margin-left: auto; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ed-split { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; }
.ed-split.nolist { grid-template-columns: minmax(0, 1fr); }
.ed-split.nolist .lib { display: none; }
.lib { border-right: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.lib-filter { padding: 10px 12px; display: flex; gap: 4px; flex-wrap: wrap; }
.lib ul { list-style: none; margin: 0; padding: 0 8px 8px; overflow: auto; }

.lib-item:hover { background: var(--raise); }

.lib-item .badge { font-size: 10.5px; font-weight: 700; opacity: .6; }

.lib-item small { font-size: var(--t-xs); opacity: .7; }

.lib-foot { padding: 10px 12px; border-top: 1px solid var(--line-soft); }
.ed-main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); min-height: 0; }
.ed-form { overflow: auto; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 14px; }
.ed-preview { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 18px 22px; }
.ed-preview h5 { margin: 0 0 10px; font-size: var(--t-xs); color: var(--faint); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.md { font: 400 12.5px/1.65 var(--f-mono); white-space: pre-wrap; }
.md .h { font-weight: 700; color: var(--ink); }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: var(--t-xs); color: var(--muted); font-weight: 600; }
.link-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line-soft); }
.link-row .input { flex: 1 1 260px; width: auto; font: 12px var(--f-mono); }
.readers { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.reader { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--muted); }
.section-title { display: flex; align-items: center; gap: 8px; }
.section-title h3 { margin: 0; font-size: var(--t-md); }
.section-title .grow { flex: 1; }
.acts-list { display: flex; flex-direction: column; gap: 4px; }
.arow { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.arow textarea { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 4px 8px; resize: none; overflow: hidden; width: 100%; line-height: 1.5; display: block; }
.arow textarea:hover { border-color: var(--line); background: var(--raise); }
.arow textarea:focus { border-color: var(--ink); background: var(--raise); outline: none; }
.arow .mv { display: flex; opacity: .35; }

.arow .mv .icon-btn { width: 26px; height: 28px; font-size: 12px; }
.prio { appearance: none; border: 0; border-radius: 7px; padding: 5px 8px; font: 700 10.5px/1.2 var(--f-mono); letter-spacing: .03em; text-align: center; margin-top: 2px; cursor: pointer; }
.prio.MUST { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.prio.SHOULD { background: color-mix(in srgb, var(--warn) 17%, transparent); color: var(--warn); }
.prio.MAY { background: var(--ground); color: var(--muted); }
.rule { border: 1px solid var(--line-soft); background: var(--raise); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.rule-head { display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); color: var(--faint); font-weight: 700; }

.group { border: 1.5px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }

.opbtn { border: 0; border-radius: 6px; padding: 3px 9px; font-weight: 700; font-size: 11px; background: var(--hl-soft); color: var(--ink); }
.leaf { display: flex; gap: 4px; align-items: center; }
.leaf .input { border-radius: 99px; padding: 4px 12px; }
.expr { font: 12px var(--f-mono); color: var(--muted); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.expr b { color: var(--faint); font-family: var(--f-ui); font-size: 11px; margin-right: 8px; }
.add { border: 0; background: transparent; color: var(--muted); font-size: var(--t-xs); font-weight: 600; padding: 4px 6px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; }
.add:hover { color: var(--ink); background: var(--surface); }
.pbody { width: 100%; min-height: 260px; flex: 1; border: 1px solid var(--line); background: var(--raise); border-radius: 12px; padding: 14px 16px; font: 13px/1.7 var(--f-mono); resize: vertical; }

/* 지침: 문서 한 장 */
.rdoc-wrap { overflow: auto; min-height: 0; padding: 18px 24px 36px; }
.rdoc { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
.readers-bar { max-width: 760px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: var(--t-xs); padding: 8px 12px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line-soft); }
.readers-bar.warn { border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.readers-bar .rd { display: inline-flex; align-items: center; gap: 5px; }

.doc-title { border: 0; background: transparent; font: 700 1.6rem/1.25 var(--f-title); padding: 0; width: 100%; outline: none; }
.doc-desc { border: 0; background: transparent; color: var(--muted); width: 100%; padding: 2px 0 0; outline: none; }
.rdoc h3 { margin: 0 0 6px; font-size: var(--t-xs); color: var(--faint); font-weight: 700; letter-spacing: .06em; }
.dlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ditem { display: grid; grid-template-columns: 74px minmax(0, 1fr) 32px; gap: 8px; align-items: start; padding: 3px 0; border-bottom: 1px solid var(--line-soft); }
.ditem textarea { border: 0; background: transparent; resize: none; overflow: hidden; width: 100%; padding: 5px 6px; line-height: 1.55; font-size: var(--t-md); display: block; }
.ditem textarea:focus { outline: none; background: var(--raise); border-radius: 8px; box-shadow: 0 0 0 1.5px var(--ink); }
.ditem .more { opacity: 0; }
.ditem:hover .more, .ditem:focus-within .more, .ditem .more:has(.pop) { opacity: 1; }
.pw { border: 0; border-radius: 99px; padding: 4px 0; font-weight: 700; font-size: var(--t-xs); margin-top: 4px; white-space: nowrap; }
.pw.MUST { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pw.SHOULD { background: color-mix(in srgb, var(--warn) 17%, transparent); color: var(--warn); }
.pw.MAY { background: var(--ground); color: var(--muted); }
.rcard { border: 1px solid var(--line-soft); background: var(--raise); border-radius: 16px; padding: 10px 14px 8px; display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.when-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.when-line .grow { flex: 1; }
.when-lbl { font-weight: 700; font-size: var(--t-xs); background: var(--hl); color: var(--hl-ink); border-radius: 6px; padding: 2px 8px; }
.cchip { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 0 3px 0 11px; }
.cchip input { border: 0; background: transparent; padding: 4px 0; outline: none; font-weight: 600; max-width: 340px; }
.cchip .cx { border: 0; background: transparent; color: var(--faint); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font-size: 10px; opacity: 0; }
.cchip:hover .cx, .cchip:focus-within .cx { opacity: 1; }
.cgroup { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; border: 1.5px dashed var(--line); border-radius: 14px; padding: 3px 4px 3px 8px; }
.opword { border: 0; background: transparent; font-weight: 700; font-size: var(--t-xs); color: var(--muted); padding: 2px 4px; border-radius: 6px; text-decoration: underline dotted; text-underline-offset: 3px; }
.opword:hover { background: var(--hl-soft); color: var(--ink); }
.add.big { border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px; justify-content: center; width: 100%; }
.tpl { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 320px; border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }
.tpl-l { border-right: 1px solid var(--line-soft); overflow: auto; max-height: 380px; padding: 4px 6px; }
.tpl-r { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; overflow: auto; max-height: 380px; }
.tpl-item { display: grid; grid-template-columns: 18px auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.tpl-item input { accent-color: var(--ink); margin: 0; }
@container (max-width: 520px) { .strip { padding: 2px 12%; } .arrow.l { left: calc(12% - 22px); } .arrow.r { right: calc(12% - 22px); } }
@container (max-width: 700px) { .tpl { grid-template-columns: minmax(0, 1fr); } .tpl-l { max-height: 160px; border-right: 0; border-bottom: 1px solid var(--line-soft); } .ditem { grid-template-columns: 62px minmax(0, 1fr) 32px; } .rdoc-wrap { padding: 14px; } }

/* 설정 */
.set { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.set .card { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.set .wide { grid-column: 1 / -1; }
.set h3 { margin: 0; font-size: var(--t-md); display: flex; align-items: center; gap: 8px; }
.set h3 .i { color: var(--faint); }
.sfield { display: flex; flex-direction: column; gap: 4px; }
.sfield > span { font-size: var(--t-xs); font-weight: 600; color: var(--muted); }
.sfield small { color: var(--faint); font-size: 11px; }
.inline { display: flex; gap: 6px; align-items: center; }
.num-in { width: 110px; }
.themes { display: flex; gap: 8px; flex-wrap: wrap; }
.themecard { border: 1.5px solid var(--line); background: var(--raise); border-radius: 12px; padding: 7px; width: 108px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.themecard[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--hl); }

.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.keys dt kbd { font: 600 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--raise); }

.price input { width: 76px; text-align: right; padding: 3px 6px; border: 1px solid var(--line); background: var(--raise); border-radius: 6px; }

/* 프로젝트 줄 */
.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
.projbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--raise); border-radius: 12px; padding: 6px 10px 6px 12px; font-weight: 700; font-size: var(--t-md); max-width: 280px; }
.projbtn:hover, .projbtn[aria-expanded="true"] { border-color: var(--ink); }
.projbtn .i:first-child { color: var(--faint); }
.projbtn .i:last-child { color: var(--faint); font-size: 12px; }
.topbar .path { font-size: 11.5px; color: var(--faint); }
.topbar .grow { flex: 1; min-width: 0; }
.proj-pop { width: 340px; }
.proj-pop .menu-item b { font-weight: 600; }
.proj-pop .menu-item[aria-current="true"] { background: var(--hl); color: var(--hl-ink); }
.proj-pop .menu-item[aria-current="true"] small { color: inherit; opacity: .7; }
.bell { position: relative; }
.bell .badge { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; border-radius: 99px; background: var(--bad); color: #fff; font: 700 10px/16px var(--f-ui); padding: 0 4px; text-align: center; }
.bell-pop { width: 360px; padding: 6px; }
.pop-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px; font-size: var(--t-xs); color: var(--faint); font-weight: 700; }
.pop-head .link { margin-left: auto; }
.troom { width: 100%; border: 0; background: transparent; text-align: left; border-radius: 10px; padding: 8px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.troom:hover { background: var(--hl-soft); }
.troom small { grid-column: 2; color: var(--faint); font-size: var(--t-xs); }
.troom .pill { grid-column: 3; grid-row: 1 / 3; }
.acctbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 4px 8px; color: var(--muted); font-weight: 600; font-size: var(--t-xs); }
.acctbtn:hover, .acctbtn[aria-expanded="true"] { background: var(--raise); border-color: var(--line); color: var(--ink); }
.acctbtn .tools { display: inline-flex; gap: 5px; }
.acct-list { width: 440px; max-width: calc(100vw - 60px); padding: 6px; }
.arow2 { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 8px; border-top: 1px solid var(--line-soft); }
.arow2:first-of-type { border-top: 0; }
.arow2 .meta { grid-column: 2; color: var(--muted); font-size: var(--t-xs); }
.arow2 .acts { grid-column: 3; grid-row: 1 / 3; display: flex; gap: 4px; }
.arow2 .sub { grid-column: 1 / -1; margin-top: 8px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border-radius: 12px; padding: 10px; }
.arow2 .sub p { margin: 0; color: var(--muted); font-size: var(--t-xs); }
.gearbtn[aria-pressed="true"] { background: var(--hl); color: var(--hl-ink); }

/* 프로젝트 첫 화면 */
.home { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.home .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.trow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
.trow:hover { background: var(--surface); }
.trow b { font-weight: 600; }
.attn { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--line-soft); }
.attn:first-of-type { border-top: 0; }
.attn > .i { color: var(--warn); }
.attn.bad > .i { color: var(--bad); }
.attn small { display: block; color: var(--faint); font-size: var(--t-xs); }
.allgood { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; padding: 4px; }
.srow2 { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px; border-radius: 10px; }
.srow2:hover { background: var(--surface); }
.srow2 .t { font-weight: 600; }
.srow2 small { grid-column: 2; color: var(--faint); font-size: var(--t-xs); }
.srow2 .acts { grid-column: 3; grid-row: 1 / 3; display: flex; gap: 4px; opacity: .55; }
.srow2:hover .acts, .srow2:focus-within .acts { opacity: 1; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line-soft); background: var(--raise); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.pcard:hover { border-color: var(--ink); }
.pcard .top { display: flex; align-items: center; gap: 8px; }
.pcard .top b { font-size: var(--t-md); }
.pcard .top .pill { margin-left: auto; }
.pcard .path { font: 11px var(--f-mono); color: var(--faint); }
.pcard .live { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
.pcard .foot2 { display: flex; gap: 12px; color: var(--muted); font-size: var(--t-xs); border-top: 1px solid var(--line-soft); padding-top: 8px; }
.pcard.add { border-style: dashed; align-items: center; justify-content: center; color: var(--muted); min-height: 140px; font-weight: 600; }
.cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cards3 .card { padding: 14px 16px; }
.cards3 span { display: block; color: var(--faint); font-size: var(--t-xs); font-weight: 600; }
.cards3 b { font: 700 1.6rem/1.2 var(--f-title); }
.cards3 small { color: var(--faint); font-size: var(--t-xs); }
.thr { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 4px; border-top: 1px solid var(--line-soft); margin-top: 4px; font-size: var(--t-xs); color: var(--muted); }
.thr input { width: 56px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--raise); text-align: right; }
.choose { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 20px; text-align: center; color: var(--muted); }
.choose .pgrid { width: min(720px, 100%); text-align: left; }
@container (max-width: 760px) { .home, .cards3 { grid-template-columns: minmax(0, 1fr); } .topbar .path { display: none; } .acctbtn .lbl { display: none; } }

/* 구독 한도 */
.limits { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.lrow { display: grid; grid-template-columns: 22px 92px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-soft); }
.lrow:first-of-type { border-top: 0; }
.lrow .name { font-weight: 600; }
.lbars { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; }
@container (max-width: 560px) { .lbars { grid-template-columns: minmax(0, 1fr); } .lrow { grid-template-columns: 22px minmax(0, 1fr); } .lrow .lbars, .lrow > .lnote, .lrow > .with-btn { grid-column: 1 / -1; } }
.lbar { display: flex; flex-direction: column; gap: 4px; }
.lbar .head { display: flex; align-items: baseline; gap: 8px; font-size: var(--t-xs); color: var(--muted); }
.lbar .head b { font: 700 var(--t-md) var(--f-ui); color: var(--ink); }
.lbar .head small { margin-left: auto; color: var(--faint); }
.track { height: 8px; border-radius: 8px; background: var(--ground); overflow: hidden; }
.track span { display: block; height: 100%; border-radius: 8px; background: var(--ink); }
.track.warn span { background: var(--warn); } .track.bad span { background: var(--bad); }
.lnote { color: var(--faint); font-size: var(--t-xs); }

/* 대화상자 */
.modal-bg { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 35%, transparent); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { width: min(520px, 100%); background: var(--raise); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 100%; }
.modal.wide { width: min(700px, 100%); }
.modal header { padding: 18px 20px 6px; }
.modal header h3 { margin: 0; font: 700 var(--t-lg)/1.3 var(--f-title); }
.modal .mbody { padding: 8px 20px 14px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.modal footer { padding: 12px 20px 16px; display: flex; justify-content: flex-end; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.check input { margin: 3px 0 0; accent-color: var(--bad); }
.check small { display: block; color: var(--faint); font-size: var(--t-xs); }
.diff { font: 12px/1.6 var(--f-mono); background: var(--surface); border-radius: 10px; padding: 8px 10px; max-height: 260px; overflow: auto; white-space: pre; }
.diff .m { color: var(--bad); } .diff .p { color: var(--ok); }
.toast { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: 99px; padding: 8px 16px; font-size: var(--t-xs); font-weight: 600; box-shadow: var(--shadow); z-index: 60; white-space: nowrap; display: flex; gap: 8px; align-items: center; }

/* 본문 폭에 맞춘다 */
@container (max-width: 980px) {
  .ed-main { grid-template-columns: minmax(0, 1fr); }
  .ed-preview { display: none; }
  .split { grid-template-columns: 300px minmax(0, 1fr); }
  .set { grid-template-columns: minmax(0, 1fr); }
}
@container (max-width: 760px) {
  .sum2, .two { grid-template-columns: minmax(0, 1fr); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .split.has-sel .list-pane { display: none; }
  .split:not(.has-sel) .detail { display: none; }
  .ed-split { grid-template-columns: minmax(0, 1fr); }
  .ed-split .lib { display: none; }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .rtools .title { display: none; }
  .nt-foot { grid-template-columns: minmax(0, 1fr); }
  .nt-foot .go { grid-column: 1; grid-row: auto; }
  .page { padding: 16px; }
}
@media (max-width: 860px) {
  .window { grid-template-columns: 60px minmax(0, 1fr); }
  .nav { padding: 10px 6px; align-items: center; }
  .logo span, .menu .lbl, .menu kbd, .nav-top .icon-btn { display: none; }
  .menu button { grid-template-columns: 18px; justify-content: center; position: relative; padding: 10px; }
  .menu .new { position: absolute; top: 6px; right: 6px; }
}
@media (max-width: 560px) {
  body { padding: 16px 16px 32px; }
  .window { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 780px; }
  .nav { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .logo { display: none; }
  .menu { flex-direction: row; }
}

      <div class="home">

  function acctPop(t) {
    const a = accounts[t];
    return `<div style="display:flex;flex-direction:column;gap:8px">

        : (a.files ? '<p>저장한 프로필이 없습니다.</p>' : '')}

  function filterChips(key) {

  // ── 사용량 ──
  // 한도는 계정 단위라 프로젝트를 골라도 그대로다. Claude 는 상태줄 입력의 rate_limits, Codex 는 세션 기록의 rate_limits 에서 읽는다
  const LIMITS = {
    claude: { at: '오늘 14:20', bars: [['5시간', 23.5, '2시간 10분 뒤 초기화'], ['7일', 41.2, '10-09 (목) 09:00 초기화']] },

  }
  function usage() {
    const f = state.usageFilter;
    const p = state.proj && !state.usageAll ? state.proj : null;
    const share = p ? .61 : 1;
    const mult = (f === 'all' ? 1 : f === 'claude' ? .72 : f === 'codex' ? .28 : 0) * share;
    const daily = [3.1, 2.2, 4.8, 1.0, 0, 2.7, 5.9, 3.3, 2.1, 3.4, 1.2, 5.6, 4.0, 0.8, 4.1, 2.5, 3.9, 1.8, 0.6, 2.2, 4.4, 3.0, 2.8, 5.1, 1.4, 0.9, 3.6, 4.7, 2.0, 4.12];
    const grains = { day: daily.map((v) => v / 6), week: [12.4, 18.9, 22.3, 15.0, 9.7, 21.2, 26.0, 19.3, 14.8, 23.6, 17.1, 21.2].map((v) => v / 6), month: [18.2, 44.0, 61.9, 70.3, 88.1, 79.4, 95.0, 102.3, 84.7, 21.2].map((v) => v / 6) };
    const data = grains[state.grain].map((v) => +(v * mult).toFixed(2));
    const labels = state.grain === 'day' ? data.map((_, i) => (i % 5 === 4 || i === data.length - 1 ? (i === data.length - 1 ? '오늘' : `${(i + 6) % 30 + 1}일`) : '')) : state.grain === 'week' ? data.map((_, i) => (i % 2 ? '' : `${7 + Math.floor(i / 4)}월`)) : ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10'].map((m) => `${m}월`);
    const total = data.reduce((a, b) => a + b, 0);
    const max = Math.max(.1, ...data) * 1.1;
    const W = 760, H = 210, pl = 44, pb = 24, pt = 10;
    const step = (W - pl - 8) / data.length, bw = Math.min(40, step * .66);
    const y = (v) => H - pb - (v / max) * (H - pb - pt);
    const ticks = [0, max / 2, max].map((v) => `<line x1="${pl}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(1)}M</text>`).join('');
    const bars = data.map((v, i) => { const x = pl + i * step + (step - bw) / 2; const last = i === data.length - 1;
      return `<rect class="b" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - pb - y(v))}" rx="4" fill="${last ? 'var(--hl)' : 'color-mix(in srgb, var(--ink) 18%, var(--surface))'}" ${last ? 'stroke="var(--ink)" stroke-width="1.2"' : ''}><title>${labels[i] || ''} ${v.toFixed(2)}M 토큰</title></rect>${labels[i] ? `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>` : ''}`; }).join('');
    const tk = (v) => (v * mult).toFixed(1) + 'M';
    const projectsTop = [['d-AI-so', 9.8, 61.2], ['guigu-mod-ko', 3.1, 19.4], ['sonmat', 1.6, 10.0], ['blog', 1.0, 6.3], ['old-scripts', 0.5, 3.1]];
    return `<div class="phead"><h2>사용량</h2>

        <div class="card"><span>최근 30일</span><b>${tk(16.0)}</b><small>캐시 읽기 ${tk(14.1)}는 따로 셉니다</small></div>
      </div>
      <section class="card box"><div class="box-head"><h3>${p ? esc(p) + ' · ' : ''}토큰 추이</h3><span class="r"><span class="seg">${[['day', '일별'], ['week', '주별'], ['month', '월별']].map(([k, l]) => `<button type="button" data-grain="${k}" aria-pressed="${state.grain === k}" title="${k === 'day' ? '최근 30칸' : '최근 12칸'}">${l}</button>`).join('')}</span></span></div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="기간별 토큰">${ticks}${bars}</svg></section>
      <div class="two">
        ${p ? '' : `<section class="card box"><div class="box-head"><h3>프로젝트별</h3></div><div class="tbl-wrap"><table class="tbl num"><thead><tr><th>프로젝트</th><th class="r">토큰</th><th class="r">비중</th></tr></thead><tbody>
          ${projectsTop.map(([n, t, pc]) => `<tr><td><button class="link" type="button" data-proj="${esc(n)}" title="이 프로젝트로 바꿉니다">${esc(n)}</button></td><td class="r">${(t * mult).toFixed(1)}M</td><td class="r"><span class="share"><span style="width:${pc}%"></span></span>${pc}%</td></tr>`).join('')}</tbody></table></div></section>`}
        <section class="card box"><div class="box-head"><h3>모델별</h3></div><div class="tbl-wrap"><table class="tbl num"><thead><tr><th>모델</th><th class="r">토큰</th><th class="r">비중</th></tr></thead><tbody>
          ${[['claude', 'claude-opus-5-5', 11.2, 70], ['claude', 'claude-sonnet-5-5', 1.6, 10], ['codex', 'gpt-5.2-codex', 3.2, 20]].filter((r) => f === 'all' || r[0] === f).map(([t, m, n, pc]) => `<tr><td>${tool(t, 'sm')} <span class="mono" style="font-size:12px">${m}</span></td><td class="r">${(n * share).toFixed(1)}M</td><td class="r"><span class="share"><span style="width:${pc}%"></span></span>${pc}%</td></tr>`).join('')}</tbody></table></div></section>

  // ── 터미널 ──
  function terminal() {

        ${vis.map(([x, i]) => `<span class="room" role="tab" aria-pressed="${!showNew && i === state.room}" title="${esc(roomTitle(x))} · ${ROOM_ST[x.st][0]}"><button type="button" data-room="${i}" style="border:0;background:transparent;display:inline-flex;align-items:center;gap:8px;padding:0 0 0 2px;font-weight:inherit;color:inherit">${tool(x.t, 'sm')}<span class="name">${esc(state.proj ? x.name : x.dir + ' · ' + x.name)}</span>${x.st === 'ask' ? `<span title="허락 기다림" style="color:var(--warn);display:inline-flex">${ic('hourglass-split')}</span>` : ''}${x.unseen ? '<span class="new-dot" title="안 본 답이 있습니다"></span>' : ''}</button><button class="x" type="button" data-close-room="${i}" title="이 방을 닫고 프로세스를 끝냅니다">${ic('x-lg')}</button></span>`).join('')}

  function roomBody(r) {

  // ── 대화상자 ──
  function modalHtml() {

  // ── 그리기 ──
  const PAGES = { summary, usage, terminal, sessions: sessionsPage, rules: rulesPage, prompts: promptsPage, settings: settingsPage };
  function render() {
    renderNav();
    const page = $('page');
    const fixed = { terminal: 'term-page', sessions: 'sess-page', rules: state.proj ? 'ed-page' : null, prompts: 'ed-page' }[state.tab];
    page.className = 'page' + (fixed ? ` fixed ${fixed}` : '');
    page.innerHTML = PAGES[state.tab]();
    $('overlay').innerHTML = (state.modal ? `<div class="modal-bg" data-modal-bg>${modalHtml()}</div>` : '')
      + (state.ctx ? `<div class="pop ctx-menu" style="left:${state.ctx.x}px;top:${state.ctx.y}px"><button class="menu-item" type="button" data-ctx-open="term">${ic('terminal')}터미널에서 열기</button><button class="menu-item" type="button" data-ctx-open="detail">${ic('chat-left-text')}상세보기</button></div>` : '');
    if (state.tab === 'rules' && state.proj) autosize();
    if (state.tab === 'terminal') { const m = $('msgs'); if (m) m.scrollTop = m.scrollHeight; }
    if (state.picker) { const q = $('pick-q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  }
  function autosize() { document.querySelectorAll('.arow textarea, .ditem textarea').forEach((t) => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }); }
  function refreshPreview() { const p = $('r-preview'); if (p) p.innerHTML = previewText(); }
  function nodeAt(path) { const parts = path.split('.').map(Number); let n = preset.rules[parts[0]].when; const chain = [n]; for (const i of parts.slice(1)) { n = n.items[i]; chain.push(n); } return { n, chain, parts }; }
  function actList(key) { return key === 'g' ? preset.global : preset.rules[+key.slice(1)].then; }
  function markDirty() { if (!state.dirty) { state.dirty = true; const s = document.querySelector('.ed-top .state'); if (s) s.textContent = '● 저장 안 함'; } }
  let pendingGuard = null;

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-open], [data-recent]');
    if (!e.target.closest('.pop') && !e.target.closest('[data-pop]') && !e.target.closest('[data-picker]') && (state.pop || state.ctx || state.picker)) {
      const had = state.pop || state.ctx || state.picker; state.pop = null; state.ctx = null; state.picker = null; state.pickQ = '';
      if (had && !t) { render(); return; }
    }
    if (e.target.matches('[data-modal-bg]')) { state.modal = null; render(); return; }
    if (!t) return;
    const d = t.dataset;
    if (t.id === 'back' && state.hpos > 0) { state.hpos--; go(state.hist[state.hpos], false); return; }
    if (t.id === 'fwd' && state.hpos < state.hist.length - 1) { state.hpos++; go(state.hist[state.hpos], false); return; }
    if (d.proj !== undefined) { state.proj = d.proj || null; state.pop = null; state.nt.folder = null; state.newTerm = false; state.cur = null; state.sel.clear(); state.inserted = false; state.usageAll = false; render(); return; }
    if (d.jump) { const r = rooms[+d.jump]; state.proj = r.dir; state.room = +d.jump; r.unseen = false; state.newTerm = false; state.pop = null; state.tab === 'terminal' ? render() : go('terminal'); return; }
    if (d.newHere !== undefined) { state.newTerm = true; state.nt = { tool: null, folder: null, conv: null, prompt: state.inserted ? prompt.id : null, model: null, args: '' }; state.tab === 'terminal' ? render() : go('terminal'); return; }
    if (d.see) { state.cur = +d.see; go('sessions'); return; }
    if (d.tidy !== undefined) { sessionList().filter((s) => s.age > state.days || s.size > state.mb).forEach((s) => state.sel.add(s.id)); go('sessions'); return; }
    if (d.acctOpen) { state.acctOpen = state.acctOpen === d.acctOpen ? null : d.acctOpen; render(); return; }
    if (d.limits) { state.limitsOn = d.limits === 'on'; render(); toast(state.limitsOn ? 'Claude 상태줄을 등록했습니다. 다음 응답부터 한도가 들어옵니다' : 'DAIso 상태줄을 빼고 원래 설정으로 돌렸습니다'); return; }
    if (d.uall !== undefined) { state.usageAll = d.uall === '1'; render(); return; }
    if (d.backTab !== undefined) { let i = state.hpos - 1; while (i > 0 && state.hist[i] === 'settings') i--; go(state.hist[Math.max(0, i)] || 'summary'); return; }
    if (d.go) { if (d.go === 'settings' && state.tab === 'settings') return; go(d.go); return; }
    if (d.themeSet) { setTheme(d.themeSet); return; }
    if (d.reload) { reload(d.reload); return; }
    if (d.pop) { state.pop = state.pop === d.pop ? null : d.pop; render(); return; }
    if (d.filter) { const [k, v] = d.filter.split(':'); state[k] = v; render(); return; }
    if (d.saveProf) { const inp = $('prof-name-' + d.saveProf); const st = $('prof-status-' + d.saveProf); if (!inp.value.trim()) { st.textContent = '보관할 이름을 적어 주세요'; st.style.color = 'var(--warn)'; return; } accounts[d.saveProf].profiles.push({ n: inp.value.trim(), d: '지금 계정 · 저장 2026-10-05 14:52' }); const n = inp.value.trim(); render(); $('prof-status-' + d.saveProf).textContent = `‘${n}’(으)로 저장했습니다`; return; }
    if (d.useProf) { const [tl, i] = d.useProf.split(':'); state.pop = null; render(); toast(`‘${accounts[tl].profiles[+i].n}’(으)로 바꿨습니다. 새로 여는 터미널부터 적용됩니다`); return; }
    if (d.delProf) { const [tl, i] = d.delProf.split(':'); const n = accounts[tl].profiles.splice(+i, 1)[0].n; render(); $('prof-status-' + tl).textContent = `‘${n}’을(를) 지웠습니다`; return; }
    if (d.recent !== undefined) { const r = t.getBoundingClientRect(), w = $('app').getBoundingClientRect(); state.ctx = { x: e.clientX - w.left, y: e.clientY - w.top, i: +d.recent }; render(); return; }
    if (d.ctxOpen) { state.ctx = null; if (d.ctxOpen === 'term') { state.newTerm = false; state.room = 0; go('terminal'); toast('이어서 열 준비를 마쳤습니다'); } else { state.cur = 3; go('sessions'); } return; }
    if (d.grain) { state.grain = d.grain; render(); return; }
    // 터미널
    if (d.newTerm !== undefined) { state.newTerm = true; state.find = false; render(); return; }
    if (d.room) { state.room = +d.room; state.newTerm = false; rooms[state.room].unseen = false; state.find = false; render(); return; }
    if (d.closeRoom) { rooms.splice(+d.closeRoom, 1); state.room = -1; if (!rooms.some((x) => !state.proj || x.dir === state.proj)) state.newTerm = true; render(); toast('방을 닫고 프로세스를 끝냈습니다'); return; }
    if (d.view) { rooms[state.room].view = d.view; state.cmdOpen = false; render(); return; }
    if (d.find !== undefined) { state.find = !state.find; render(); if (state.find) $('find-q').focus(); return; }
    if (d.sameFolder !== undefined) { state.nt = { tool: rooms[state.room].t, folder: projOf(rooms[state.room].dir)[1], conv: null, prompt: null, model: null, args: '' }; state.newTerm = true; state.pop = null; render(); return; }
    if (d.cmd) { if (d.tui) { state.draft = ''; state.cmdOpen = false; rooms[state.room].view = 'term'; render(); toast(`${d.cmd} 는 터미널 보기에서 칩니다`, 'terminal'); return; } state.draft = d.cmd + ' '; state.cmdOpen = false; render(); const ta = $('draft'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); return; }
    if (d.send !== undefined) { sendDraft(); return; }
    if (d.ntTool) { if (state.nt.tool !== d.ntTool) { state.nt.tool = d.ntTool; state.nt.conv = null; state.nt.model = null; } render(); return; }
    if (d.picker) { state.picker = state.picker === d.picker ? null : d.picker; state.pickQ = ''; render(); return; }
    if (d.pick) { const [k, ...v] = d.pick.split(':'); state.nt[k] = v.join(':') || null; if (k === 'conv' && !state.nt.conv) state.nt.conv = 'new'; state.picker = null; state.pickQ = ''; render(); return; }
    if (d.start !== undefined) { const nt = state.nt; if (nt.tool === 'anti') { toast('Antigravity 공식 설치 안내를 브라우저로 열었습니다', 'box-arrow-up-right'); return; } const f = FOLDERS.find((x) => x[1] === nt.folder); rooms.push({ t: nt.tool, dir: f[0], name: `새 방 ${rooms.length + 1}`, st: 'idle', since: '방금', view: 'chat', unseen: false }); state.room = rooms.length - 1; state.newTerm = false; state.nt = { tool: null, folder: null, conv: null, prompt: null, model: null, args: '' }; render(); return; }
    // 세션
    if (d.search !== undefined) { doSearch(); return; }
    if (d.clearSearch !== undefined) { state.sQ = ''; state.sSearch = ''; render(); return; }
    if (d.resetFilter !== undefined) { state.sTool = 'all'; state.sPeriod = 'all'; state.pop = null; render(); return; }
    if (d.pickSel) { sessionList().filter((s) => d.pickSel === 'old' ? s.age > state.days : d.pickSel === 'orphan' ? s.orphan : s.size > state.mb).forEach((s) => state.sel.add(s.id)); state.pop = null; render(); return; }
    if (d.clearSel !== undefined) { state.sel.clear(); render(); return; }
    if (d.delete !== undefined) { state.modal = 'delete'; state.permanent = false; render(); return; }
    if (d.confirmDelete !== undefined) { const ids = [...state.sel]; const gone = sessions.filter((s) => ids.includes(s.id) && !s.run); gone.forEach((s) => sessions.splice(sessions.indexOf(s), 1)); state.sel.clear(); state.modal = null; if (!sessions.find((s) => s.id === state.cur)) state.cur = null; render(); toast(`${gone.length}건을 ${state.permanent ? '바로 지웠습니다' : '휴지통으로 보냈습니다'}`); return; }
    if (d.resume !== undefined) { state.room = 0; state.newTerm = false; go('terminal'); toast('이 세션을 터미널 방에서 이어서 열었습니다'); return; }
    if (d.backList !== undefined) { state.cur = null; render(); return; }
    if (d.open && !e.target.matches('input')) { state.cur = +d.open; render(); return; }
    // 지침 · 프롬프트
    if (d.lib) { const [kind, id] = d.lib.split(':'); const apply = () => { if (kind === 'rules') state.ruleCur = id; else { state.promptCur = id; state.inserted = false; } state.dirty = false; render(); }; if (state.dirty) { pendingGuard = apply; state.modal = 'discard'; render(); } else apply(); return; }
    if (d.libf) { const [kind, f] = d.libf.split(':'); if (kind === 'rules') state.ruleFilter = f; else state.promptFilter = f; render(); return; }
    if (d.guard) { const act = () => { state.dirty = false; render(); toast(d.guard === '열기' ? 'PROJECT_RULES.daiso 를 열었습니다' : '새로 만들었습니다'); }; if (state.dirty) { pendingGuard = act; state.modal = 'discard'; render(); } else act(); return; }
    if (d.discard !== undefined) { state.modal = null; const g = pendingGuard; pendingGuard = null; state.dirty = false; g ? g() : render(); return; }
    if (d.closeModal !== undefined) { state.modal = null; render(); if (d.toast) toast(d.toast); return; }
    if (d.migrate !== undefined) { state.modal = 'migrate'; render(); return; }
    if (d.confirmMigrate !== undefined) { state.modal = null; readers.codex = 'ok'; render(); toast('AGENTS.md 를 만들었습니다 · 경고 없음'); return; }
    if (d.templates !== undefined) { state.modal = 'templates'; state.tplPicks = new Set(); render(); return; }
    if (d.tpl) { state.tpl = d.tpl; state.tplPicks = new Set(); render(); return; }
    if (d.tplAdd !== undefined) { const src = tplItems(state.tpl); const picked = [...state.tplPicks].map((i) => src[i]).filter(Boolean); picked.forEach((x) => preset.global.push([...x])); state.modal = null; markDirty(); render(); toast(`${picked.length}개를 ‘언제나’에 넣었습니다`); return; }
    if (d.rview) { state.rview = d.rview; render(); return; }
    if (d.cycle) { const k = d.cycle.slice(0, d.cycle.lastIndexOf('.')), i = +d.cycle.split('.').pop(); const it = actList(k)[i]; it[0] = PRIOS[(PRIOS.indexOf(it[0]) + 1) % 3]; t.className = `pw ${it[0]}`; t.textContent = PW[it[0]]; t.title = `${it[0]} · 눌러서 바꾸기`; markDirty(); return; }
    if (d.setFolder) { preset.folder = d.setFolder; state.pop = null; markDirty(); render(); return; }
    if (d.link !== undefined) { readers.codex = 'ok'; render(); toast(`${state.proj || 'd-AI-so'} 의 AGENTS.md 에 불러오는 줄을 넣었습니다`); return; }
    if (d.addAct) { actList(d.addAct).push(['SHOULD', '']); markDirty(); render(); const all = document.querySelectorAll(`[data-act^="${d.addAct}."]`); all[all.length - 1]?.focus(); return; }
    if (d.delAct) { const [k, i] = [d.delAct.slice(0, d.delAct.lastIndexOf('.')), +d.delAct.split('.').pop()]; actList(k).splice(i, 1); markDirty(); render(); return; }
    if (d.move) { const [p, dir] = d.move.split(':'); const k = p.slice(0, p.lastIndexOf('.')), i = +p.split('.').pop(); const l = actList(k); const j = i + +dir; if (j >= 0 && j < l.length) { [l[i], l[j]] = [l[j], l[i]]; markDirty(); render(); } return; }
    if (d.addRule !== undefined) { preset.rules.push({ when: { leaf: '' }, then: [['SHOULD', '']] }); markDirty(); render(); return; }
    if (d.delRule) { preset.rules.splice(+d.delRule, 1); markDirty(); render(); return; }
    if (d.flip) { const { n } = nodeAt(d.flip); n.op = n.op === 'and' ? 'or' : 'and'; markDirty(); render(); return; }
    if (d.addLeaf) { nodeAt(d.addLeaf).n.items.push({ leaf: '' }); markDirty(); render(); return; }
    if (d.addGroup) { nodeAt(d.addGroup).n.items.push({ op: 'or', items: [{ leaf: '' }, { leaf: '' }] }); markDirty(); render(); return; }
    if (d.wrap) { const [ri, op] = d.wrap.split(':'); const r = preset.rules[+ri]; r.when = { op, items: [r.when, { leaf: '' }] }; markDirty(); render(); return; }
    if (d.delLeaf) { const { parts } = nodeAt(d.delLeaf); if (parts.length === 1) { preset.rules[parts[0]].when = { leaf: '' }; } else { const parent = nodeAt(parts.slice(0, -1).join('.')).n; parent.items.splice(parts[parts.length - 1], 1); if (parent.items.length === 1 && parts.length === 2) preset.rules[parts[0]].when = parent.items[0]; } markDirty(); render(); return; }
    if (d.pmode) { state.previewMode = d.pmode; refreshPreview(); document.querySelectorAll('[data-pmode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pmode === d.pmode))); return; }
    if (d.saveRules !== undefined) { state.dirty = false; render(); $('r-msg').textContent = `${preset.folder}\\PROJECT_RULES.daiso 에 저장했습니다`; return; }
    if (d.insertProject !== undefined) { state.inserted = true; render(); return; }
    if (d.savePrompt !== undefined) { state.dirty = false; render(); $('p-msg').textContent = `‘${prompt.name}’을(를) 내 프롬프트에 저장했습니다`; return; }
    if (d.delPrompt !== undefined) { state.modal = 'del-prompt'; render(); return; }
    if (d.toast) { state.pop = null; render(); toast(d.toast); return; }
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.check) { const id = +el.dataset.check; el.checked ? state.sel.add(id) : state.sel.delete(id); render(); }
    else if (el.id === 's-all') { sessionList().forEach((s) => (el.checked ? state.sel.add(s.id) : state.sel.delete(s.id))); render(); }
    else if (el.id === 's-period') { state.sPeriod = el.value; render(); }
    else if (el.id === 'show-tools') { state.showTools = el.checked; render(); }
    else if (el.dataset.tplpick !== undefined) { const i = +el.dataset.tplpick; el.checked ? state.tplPicks.add(i) : state.tplPicks.delete(i); render(); }
    else if (el.id === 'perm') { state.permanent = el.checked; render(); }
    else if (el.dataset.prio) { const k = el.dataset.prio.slice(0, el.dataset.prio.lastIndexOf('.')), i = +el.dataset.prio.split('.').pop(); actList(k)[i][0] = el.value; el.className = `prio ${el.value}`; markDirty(); refreshPreview(); }
    else if (el.id === 'p-cat') { prompt.cat = el.value; markDirty(); }
    else if (el.id === 'thr-days' || el.id === 'thr-mb') { state[el.id === 'thr-days' ? 'days' : 'mb'] = Math.max(1, +el.value || 1); render(); }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'draft') { state.draft = el.value; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; const want = el.value.startsWith('/') && !el.value.includes(' '); if (want !== state.cmdOpen || want) { state.cmdOpen = want; state.cmdIdx = 0; const c = document.querySelector('.composer'); const old = c.querySelector('.cmdpop'); if (old) old.remove(); if (want) c.insertAdjacentHTML('afterbegin', cmdPop()); } }
    else if (el.id === 'pick-q') { state.pickQ = el.value; const pos = el.selectionStart; render(); const q = $('pick-q'); q.setSelectionRange(pos, pos); }
    else if (el.id === 'nt-args') { state.nt.args = el.value; const code = document.querySelector('.cmdline code'); if (code) { const base = code.textContent.split(' --')[0]; } }
    else if (el.id === 's-q') { state.sQ = el.value; }
    else if (el.dataset.act) { actList(el.dataset.act.slice(0, el.dataset.act.lastIndexOf('.')))[+el.dataset.act.split('.').pop()][1] = el.value; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; markDirty(); refreshPreview(); }
    else if (el.dataset.leaf) { nodeAt(el.dataset.leaf).n.leaf = el.value; el.size = Math.max(6, el.value.length + 2); markDirty(); }
    else if (el.id === 'r-name') { preset.name = el.value; markDirty(); refreshPreview(); }
    else if (el.id === 'r-desc') { preset.desc = el.value; markDirty(); }
    else if (el.id === 'p-name') { prompt.name = el.value; markDirty(); }
    else if (el.id === 'p-body') { prompt.body = el.value; markDirty(); if (state.inserted) { state.inserted = false; document.querySelector('.starter')?.remove(); } }
    else if (el.dataset.dirty !== undefined) { state.settingsDirty = true; const s = document.querySelector('.phead .state'); if (s) s.textContent = '● 저장 안 함'; }
  });
  function doSearch() {
    if (state.sQ.trim().length < 2) { status('검색어는 2글자 이상이어야 합니다', false, true); setTimeout(() => status(''), 2000); return; }
    state.sSearch = state.sQ.trim(); render();
  }
  function sendDraft() {
    const text = state.draft.trim(); if (!text) return;
    const r = rooms[state.room];
    chat.splice(chat.length - 1, 0, { k: 'me', t: text });
    state.draft = ''; state.cmdOpen = false; render();
    toast(`${TN[r.t]} 입력 줄로 보냈습니다`, 'send-fill');
  }
  document.addEventListener('keydown', (e) => {
    const el = e.target;
    if (el.id === 'draft') {
      const flat = cmdMatches().flatMap(([, , items]) => items);
      if (state.cmdOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); state.cmdIdx = (state.cmdIdx + (e.key === 'ArrowDown' ? 1 : -1) + flat.length) % flat.length; document.querySelectorAll('.cmd').forEach((b, i) => b.classList.toggle('on', i === state.cmdIdx)); document.querySelector('.cmd.on')?.scrollIntoView({ block: 'nearest' }); return; }
      if (state.cmdOpen && (e.key === 'Enter' || e.key === 'Tab') && flat.length) { e.preventDefault(); document.querySelectorAll('.cmd')[state.cmdIdx].click(); return; }
      if (state.cmdOpen && e.key === 'Escape') { state.cmdOpen = false; document.querySelector('.cmdpop')?.remove(); return; }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendDraft(); return; }
      return;
    }
    if (el.id === 's-q' && e.key === 'Enter') { doSearch(); return; }
    if (e.ctrlKey && e.key.toLowerCase() === 'p') { e.preventDefault(); state.pop = 'proj'; render(); return; }
    if (el.id === 's-q' && e.key === 'Escape') { state.sQ = ''; state.sSearch = ''; render(); return; }
    if (e.ctrlKey && /^[1-6]$/.test(e.key)) { e.preventDefault(); go(TABS[+e.key - 1][0]); return; }
    if (e.key === 'F5') { e.preventDefault(); reload((TABS.find((x) => x[0] === state.tab) || [0, '설정'])[1]); return; }
    if (e.ctrlKey && e.key.toLowerCase() === 'f') { if (state.tab === 'sessions') { e.preventDefault(); $('s-q').focus(); } else if (state.tab === 'terminal' && rooms.length && !state.newTerm) { e.preventDefault(); state.find = true; render(); $('find-q').focus(); } return; }
    if (e.ctrlKey && e.key.toLowerCase() === 's' && (state.tab === 'rules' || state.tab === 'prompts')) { e.preventDefault(); document.querySelector('[data-save-rules],[data-save-prompt]')?.click(); return; }
    if (e.key === 'Escape') { if (state.modal) { state.modal = null; render(); } else if (state.pop || state.ctx || state.picker) { state.pop = null; state.ctx = null; state.picker = null; render(); } else if (state.find) { state.find = false; render(); } }
  });
  document.addEventListener('mouseup', (e) => { if (e.button === 3 && state.hpos > 0) { state.hpos--; go(state.hist[state.hpos], false); } if (e.button === 4 && state.hpos < state.hist.length - 1) { state.hpos++; go(state.hist[state.hpos], false); } });
  document.addEventListener('contextmenu', (e) => { const r = e.target.closest('[data-recent]'); if (!r) return; e.preventDefault(); const w = $('app').getBoundingClientRect(); state.ctx = { x: e.clientX - w.left, y: e.clientY - w.top, i: +r.dataset.recent }; render(); });
  window.addEventListener('resize', () => { if (state.tab === 'rules') autosize(); });

  function setTheme(mode) {
    state.theme = mode;
    const root = document.documentElement;
    if (mode === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
    document.querySelectorAll('.memo [data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === mode)));
    if (state.tab === 'settings') render();
  }

  render();
})();
</script>
