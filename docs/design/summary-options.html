<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요약 시안 다섯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&family=Hahmlet:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #eceee7; --surface: #f7f8f4; --raise: #ffffff; --line: #d8dcd1; --line-soft: #e6e9e1;
  --ink: #1d211d; --muted: #5b635b; --faint: #8a9289; --hl: #f4c63d; --hl-soft: #fbecb8;
  --codex: #2c8a73; --claude: #c96b3c; --anti: #7a5bc2; --ok: #2f8650; --warn: #b07a0a; --bad: #c0412c;
  --shadow: 0 1px 0 rgba(29, 33, 29, .04), 0 12px 32px rgba(29, 33, 29, .10);
  --f-ui: "Gothic A1", "Malgun Gothic", sans-serif; --f-title: "Hahmlet", "Batang", serif; --f-mono: "JetBrains Mono", Consolas, monospace;
  --t-xs: .75rem; --t-sm: .84375rem; --t-md: .9375rem; --t-lg: 1.125rem; --t-xl: 1.5rem;
}
:root[data-theme="dark"] {
  --ground: #121411; --surface: #191c18; --raise: #20241f; --line: #30352e; --line-soft: #272b25;
  --ink: #eceee8; --muted: #a2a99f; --faint: #737a70; --hl: #e9bd38; --hl-soft: #3a3320;
  --codex: #4bb398; --claude: #e08a5c; --anti: #a287e0; --ok: #5cbb7e; --warn: #dcaa3c; --bad: #e66a52;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 var(--t-sm)/1.5 var(--f-ui); }
button { font: inherit; color: inherit; cursor: pointer; }
.i { width: 1em; height: 1em; fill: currentColor; flex: none; vertical-align: -.125em; }
.num { font-variant-numeric: tabular-nums; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* 시안 고르기 (앱 바깥) */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 16px 20px 12px; }
.bar h1 { font: 700 var(--t-lg) var(--f-title); margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--raise); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--hl); color: var(--ink); }
.desc { width: 100%; color: var(--muted); margin: 0; }
.desc b { color: var(--ink); }

/* 앱 틀: 실제 창 크기 */
.frame { margin: 0 20px 24px; width: 1280px; height: 820px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); background: var(--surface); box-shadow: var(--shadow); }
.frame.narrow { width: 960px; }
.nav { grid-row: 1 / 3; border-right: 1px solid var(--line-soft); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 2px 8px 14px; }
.brand span { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: 12px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--muted); font-weight: 600; text-decoration: none; }
.nav a.on { background: var(--hl); color: var(--ink); }
.top { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line-soft); }
.pick { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 5px 10px; font-weight: 600; }
.top .r { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--muted); }
.main { overflow: auto; padding: 22px 26px 30px; min-width: 0; }

/* 공통 조각 */
.tool { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; color: #fff; font: 700 11px var(--f-ui); flex: none; }
.tool.claude { background: var(--claude); } .tool.codex { background: var(--codex); }
.tool.sm { width: 18px; height: 18px; border-radius: 5px; font-size: 10px; }
.ptag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--ground); color: var(--muted); font-size: var(--t-xs); font-weight: 600; white-space: nowrap; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: 5px 12px; font-weight: 600; white-space: nowrap; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.big { padding: 9px 18px; font-size: var(--t-md); }
.faint { color: var(--faint); } .muted { color: var(--muted); }
.card { background: var(--raise); border: 1px solid var(--line-soft); border-radius: 16px; }
h2.t { font: 700 var(--t-xl)/1.2 var(--f-title); margin: 0; }
.sub { color: var(--faint); font-size: var(--t-xs); font-weight: 600; }

/* A 타임라인 */
.A { max-width: 760px; margin: 0 auto; }
.A .status { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: var(--t-xs); margin: 8px 0 18px; }
.A .status b { color: var(--ink); }
.A .status .w { color: var(--warn); font-weight: 700; }
.A .day { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 6px; }
.A .day h3 { margin: 0; font: 700 var(--t-md) var(--f-ui); }
.A .line { position: relative; padding-left: 74px; }
.A .line::before { content: ""; position: absolute; left: 58px; top: 6px; bottom: 6px; width: 2px; background: var(--line-soft); }
.A .ev { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 7px 10px; border-radius: 10px; }
.A .ev:hover { background: var(--raise); }
.A .ev .tm { position: absolute; left: -74px; width: 46px; text-align: right; color: var(--faint); font-size: var(--t-xs); top: 9px; }
.A .ev::before { content: ""; position: absolute; left: -20px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.A .ev.sys::before { background: var(--warn); }
.A .ev .tt { display: flex; gap: 8px; align-items: center; min-width: 0; }
.A .ev small { grid-column: 2; color: var(--faint); font-size: var(--t-xs); }
.A .ev .go { grid-column: 3; grid-row: 1 / 3; opacity: 0; }
.A .ev:hover .go { opacity: 1; }
.A .more { margin: 4px 0 0 0; }

/* B 브리핑 글 */
.B { max-width: 700px; margin: 6px auto 0; }
.B .date { color: var(--faint); font-weight: 700; font-size: var(--t-xs); letter-spacing: .04em; }
.B h2 { font: 700 1.9rem/1.35 var(--f-title); margin: 6px 0 22px; letter-spacing: -.01em; }
.B h2 em { font-style: normal; background: linear-gradient(transparent 62%, var(--hl-soft) 62%); }
.B p { font-size: 1.02rem; line-height: 1.85; margin: 0 0 18px; color: var(--muted); }
.B p b { color: var(--ink); }
.B .inl { display: inline-flex; vertical-align: 1px; margin-left: 4px; padding: 1px 10px; font-size: var(--t-xs); }
.B .rule { border: 0; border-top: 1px solid var(--line-soft); margin: 22px 0; }
.B .lbl { font-weight: 700; color: var(--ink); font-size: var(--t-xs); margin-bottom: 6px; display: block; letter-spacing: .04em; }

/* C 할 일 */
.C { max-width: 860px; margin: 0 auto; }
.C .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.C .head .n { font: 700 var(--t-xl) var(--f-title); color: var(--faint); }
.C .task { display: grid; grid-template-columns: 6px 36px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 14px 16px 14px 0; margin-bottom: 10px; overflow: hidden; }
.C .task .rail { align-self: stretch; background: var(--line); }
.C .task.urgent .rail { background: var(--warn); }
.C .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--ground); display: grid; place-items: center; font-size: 17px; color: var(--muted); }
.C .task b { display: block; font-size: var(--t-md); }
.C .task small { display: block; color: var(--faint); font-size: var(--t-xs); margin-top: 2px; }
.C .skip { border: 0; background: transparent; color: var(--faint); font-size: var(--t-xs); text-decoration: underline; }
.C .done-all { color: var(--faint); text-align: center; padding: 14px; font-size: var(--t-xs); }

/* D 계기판 */
.D .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 168px; gap: 14px; }
.frame.narrow .D .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.D .tile { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; text-align: left; position: relative; overflow: hidden; }
.D .tile:hover { border-color: var(--line); }
.D .tile .k { color: var(--faint); font-size: var(--t-xs); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.D .tile .v { font: 700 2.6rem/1.05 var(--f-title); margin-top: auto; }
.D .tile .v small { font: 600 var(--t-sm) var(--f-ui); color: var(--faint); margin-left: 4px; }
.D .tile .s { color: var(--muted); font-size: var(--t-xs); }
.D .tile.w2 { grid-column: span 2; }
.D .tile.has-ring .s { padding-right: 100px; white-space: nowrap; }
.frame.narrow .D .ring { width: 64px; height: 64px; }
.frame.narrow .D .tile.has-ring .s { padding-right: 72px; }
.D .tile.warn .v { color: var(--warn); }
.D .ring { position: absolute; right: 16px; top: 50%; transform: translateY(-40%); }
.D .bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 70px; margin-top: auto; }
.D .bars span { border-radius: 4px; background: color-mix(in srgb, var(--ink) 16%, var(--surface)); }
.D .bars span.today { background: var(--hl); }
.D .bl { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 10px; color: var(--faint); }

/* E 이어서 */
.E .hero { padding: 26px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 24px; align-items: end; }
.E .hero .k { color: var(--faint); font-weight: 700; font-size: var(--t-xs); display: flex; align-items: center; gap: 8px; }
.E .hero h2 { font: 700 1.75rem/1.3 var(--f-title); margin: 10px 0 8px; }
.E .hero .meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-xs); }
.E .hero .acts { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.E .row-h { display: flex; align-items: baseline; gap: 10px; margin: 24px 0 10px; }
.E .row-h h3 { margin: 0; font-size: var(--t-md); }
.E .row-h .r { margin-left: auto; }
.E .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.frame.narrow .E .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.E .mini { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-height: 150px; }
.E .mini:hover { border-color: var(--ink); }
.E .mini .q { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; word-break: break-all; }
.E .mini small { margin-top: auto; color: var(--faint); font-size: var(--t-xs); }
.E .strip { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding: 12px 16px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); font-size: var(--t-xs); }
.E .strip b { color: var(--ink); }
.E .strip .w { color: var(--warn); font-weight: 700; }
.link { border: 0; background: transparent; padding: 0; font-weight: 600; font-size: var(--t-xs); text-decoration: underline; text-decoration-color: var(--hl); text-decoration-thickness: 2px; text-underline-offset: 3px; }
</style>
</head>

    ['B', '브리핑 글', B, '<b>B 브리핑 글</b> — 카드도 표도 없이 문장으로 읽는 요약. 할 수 있는 일은 문장 끝 작은 단추로.'],
    ['C', '할 일', C, '<b>C 할 일</b> — 지금 내가 손대야 할 것만 급한 순서로 한 줄씩. 단추 하나 누르거나 넘기면 사라지는 수신함 방식.'],
    ['D', '계기판', D, '<b>D 계기판</b> — 목록 없이 큰 숫자와 게이지만. 한눈에 보고 누르면 해당 탭으로 갑니다.'],
    ['E', '이어서', E, '<b>E 이어서</b> — 마지막으로 하던 일 하나를 크게, 다른 프로젝트에서 하던 일 넷을 그 아래에. 나머지 상태는 맨 아래 한 줄.'],
  ];
  let cur = 0;
  const pick = document.getElementById('pick');
  pick.innerHTML = V.map((v, i) => `<button type="button" data-v="${i}" aria-pressed="${i === 0}">${v[0]} ${v[1]}</button>`).join('');
  function show() {
    document.getElementById('main').innerHTML = V[cur][2]();
    document.getElementById('desc').innerHTML = V[cur][3] + ' <span class="faint">숫자·제목·시각은 이 PC 실제 데이터(2026-10-06 21:40). 열린 방은 지금 0개입니다.</span>';
    pick.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === cur)));
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) { cur = +b.dataset.v; show(); }
    if (b.dataset.w) { document.getElementById('frame').classList.toggle('narrow', b.dataset.w === '960'); b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }
    if (b.dataset.th) { document.documentElement.dataset.theme = b.dataset.th; b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }
  });
  show();
})();
</script>
</body>
</html>
