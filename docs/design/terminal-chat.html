<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>터미널 말풍선 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&family=Hahmlet:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #eceee7; --surface: #f7f8f4; --raise: #ffffff; --line: #d8dcd1; --line-soft: #e6e9e1;
  --ink: #1d211d; --muted: #5b635b; --faint: #8a9289; --hl: #f4c63d; --hl-soft: #fbecb8;
  --term-bg: #171a16; --term-fg: #dfe3da; --term-dim: #81897f;
  --codex: #2c8a73; --claude: #c96b3c; --ok: #2f8650; --warn: #b07a0a; --bad: #c0412c;
  --shadow: 0 1px 0 rgba(29, 33, 29, .04), 0 12px 32px rgba(29, 33, 29, .10);
  --f-ui: "Gothic A1", "Malgun Gothic", sans-serif; --f-title: "Hahmlet", "Batang", serif; --f-mono: "JetBrains Mono", Consolas, monospace;
  --t-xs: .75rem; --t-sm: .84375rem; --t-md: .9375rem; --t-lg: 1.125rem; --t-xl: 1.5rem;
}
:root[data-theme="dark"] {
  --ground: #121411; --surface: #191c18; --raise: #20241f; --line: #30352e; --line-soft: #272b25;
  --ink: #eceee8; --muted: #a2a99f; --faint: #737a70; --hl: #e9bd38; --hl-soft: #3a3320;
  --term-bg: #0f110e; --codex: #4bb398; --claude: #e08a5c; --ok: #5cbb7e; --warn: #dcaa3c; --bad: #e66a52;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 var(--t-sm)/1.5 var(--f-ui); }
button { font: inherit; color: inherit; cursor: pointer; }
.i { width: 1em; height: 1em; fill: currentColor; flex: none; vertical-align: -.125em; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.faint { color: var(--faint); }

/* 시안 고르기 (앱 바깥) */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 16px 20px 12px; }
.bar h1 { font: 700 var(--t-lg) var(--f-title); margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--raise); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--hl); color: var(--ink); }
.desc { width: 100%; color: var(--muted); margin: 0; }
.desc b { color: var(--ink); }

/* 앱 틀: 실제 창 크기 */
.frame { margin: 0 20px 24px; width: 1280px; height: 820px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); background: var(--surface); box-shadow: var(--shadow); }
.frame.narrow { width: 960px; }
.nav { grid-row: 1 / 3; border-right: 1px solid var(--line-soft); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 2px 8px 14px; }
.brand span { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: 12px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--muted); font-weight: 600; text-decoration: none; }
.nav a.on { background: var(--hl); color: var(--ink); }
.top { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line-soft); }
.pick { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 5px 10px; font-weight: 600; }
.top .r { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--muted); }
.main { min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }

.tool { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; color: #fff; font: 700 11px var(--f-ui); flex: none; }
.tool.claude { background: var(--claude); } .tool.codex { background: var(--codex); }
.tool.sm { width: 18px; height: 18px; border-radius: 5px; font-size: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: 5px 12px; font-weight: 600; white-space: nowrap; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.small { padding: 3px 10px; font-size: var(--t-xs); }
.icon-btn { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--ground); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: var(--t-xs); font-weight: 700; white-space: nowrap; background: var(--ground); color: var(--muted); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

/* 방 띠와 도구 줄 (지금 앱과 같다) */
.rooms { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.room { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--raise); border-radius: 12px; padding: 5px 8px; font-weight: 600; white-space: nowrap; }
.room[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); }
.room .hg { color: var(--warn); display: inline-flex; }
.room[aria-pressed="true"] .hg { color: inherit; }
.room-plus { width: 36px; height: 36px; border-radius: 12px; border: 1.5px dashed var(--line); background: transparent; display: grid; place-items: center; color: var(--muted); }
.rtools { display: flex; align-items: center; gap: 2px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
.rtools .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
.rtools .title { margin-left: auto; color: var(--faint); font-size: var(--t-xs); padding-left: 10px; }

/* 말풍선 */
.chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; background: var(--surface); }
.msgs { overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: min(760px, 92%); display: flex; flex-direction: column; gap: 6px; }
.msg.me { align-self: flex-end; background: var(--hl-soft); border-radius: 16px 16px 4px 16px; padding: 10px 14px; white-space: pre-wrap; }
.msg.ai { align-self: flex-start; }
.msg.ai .body { background: var(--raise); border: 1px solid var(--line-soft); border-radius: 4px 16px 16px 16px; padding: 10px 14px; line-height: 1.65; }
.msg.ai .body p { margin: 0 0 8px; } .msg.ai .body p:last-child { margin: 0; }
.msg.ai .body ul { margin: 4px 0 8px; padding-left: 20px; }
.msg.ai .body code { font: 12px var(--f-mono); background: var(--ground); padding: 1px 5px; border-radius: 5px; }
.msg .who { font-size: 11px; font-weight: 700; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.tools { align-self: flex-start; max-width: min(760px, 92%); display: flex; flex-direction: column; gap: 4px; }
.tools > button { align-self: flex-start; border: 1px solid var(--line-soft); background: var(--raise); border-radius: 10px; padding: 4px 10px; font: 400 12px var(--f-mono); color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.tools .list { display: flex; flex-direction: column; gap: 3px; padding-left: 12px; border-left: 2px solid var(--line-soft); margin-left: 8px; }
.tools .one { display: grid; grid-template-columns: 16px auto minmax(0, 1fr); gap: 8px; align-items: center; font: 400 12px var(--f-mono); color: var(--muted); }
.tools .one b { font-weight: 600; color: var(--ink); }
.ok { color: var(--ok); } .err { color: var(--bad); }
.working { align-self: flex-start; display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: var(--t-xs); }
.dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); margin-right: 3px; animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.ask { align-self: stretch; border: 1.5px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--raise)); border-radius: 14px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ask > .i { color: var(--warn); font-size: 18px; }
.ask div { flex: 1; min-width: 200px; }
.ask code { font: 12px var(--f-mono); display: block; margin-top: 4px; white-space: pre-wrap; word-break: break-all; }
.composer { border-top: 1px solid var(--line); padding: 10px 16px 14px; background: var(--surface); position: relative; }
.compose-box { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: end; border: 1.5px solid var(--line); background: var(--raise); border-radius: 16px; padding: 6px; }
.compose-box.focus { border-color: var(--ink); }
.compose-box .text { padding: 6px 4px; min-height: 34px; line-height: 1.5; color: var(--ink); font-family: var(--f-mono); }
.compose-box .text.ph { color: var(--faint); font-family: var(--f-ui); }
.send { width: 34px; height: 34px; border-radius: 12px; border: 0; background: var(--ink); color: var(--surface); display: grid; place-items: center; }
.compose-hint { display: flex; gap: 14px; margin-top: 6px; font-size: 11px; color: var(--faint); }
.cmdpop { position: absolute; left: 16px; right: 16px; bottom: calc(100% - 4px); max-width: 620px; background: var(--raise); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; max-height: 360px; overflow: auto; z-index: 5; }
.cmdgroup { font-size: 11px; font-weight: 700; color: var(--faint); padding: 8px 10px 4px; display: flex; align-items: center; gap: 6px; }
.cmd { width: 100%; border: 0; background: transparent; text-align: left; border-radius: 10px; padding: 6px 10px; display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 10px; align-items: baseline; }
.cmd.on, .cmd:hover { background: var(--hl-soft); }
.cmd b { font: 600 13px var(--f-mono); white-space: nowrap; }
.cmd em { font: 400 11px var(--f-mono); color: var(--faint); font-style: normal; white-space: nowrap; }
.cmd span { color: var(--muted); font-size: var(--t-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmd.tui b, .cmd.tui span { color: var(--faint); }
.cmd.tui span::after { content: " · 터미널 보기로"; }
</style>
</head>

가 남는 문제\n  - 10초가 넘는 시험 둘\n- **위키와 구조 다이어그램(drawio)**: 미뤄 둔 그대로입니다."}, {"k": "me", "ts": "14:54", "t": "푸시 ㄱ.\n에디터닫고 빌드하고 다시 실행\n"}, {"k": "tool", "ts": "14:54", "t": "Bash cd /c/Users/박주형/Documents/GitHub/JBroEngine && git fetch -q origin && git log --oneline main..origin/main | head -3; git push origin main 2>&1 | tail -2", "ok": true}, {"k": "ai", "ts": "14:54", "t": "푸시했습니다. 이제 에디터(PID 16856)를 닫고 다시 빌드합니다."}, {"k": "tool", "ts": "14:54", "t": "PowerShell $p = Get-Process -Id 16856 -ErrorAction SilentlyContinue; if ($p) { $args0 = (Get-CimInstance Win32_Process -Filter \"ProcessId=16856\").CommandLine; Set-Content \"F:\\AI\\Temp\\claude\\C--Users-----Documents-GitHub-JBroEngine\\648447b9-9eb7-43a1-b23f-62d702f61f2d\\scratchpad\\user_editor_cmd.txt\" $args0; $args0; Stop-Process -Id 16856 -Confirm:$false; Start-Sleep 1 }; \"alive: $([bool](Get-Process -Id 16856 -ErrorAction SilentlyContinue))\"", "ok": true}, {"k": "tool", "ts": "14:55", "t": "PowerShell Set-Location C:\\Users\\박주형\\Documents\\GitHub\\JBroEngine\\source\\JBroEngine; $env:_MSPDBSRV_ENDPOINT_ = 'jbro-main-build'; $msb = & \"C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -find MSBuild\\**\\Bin\\MSBuild.exe | Select-Object -First 1; $out = & $msb JBroEngine.slnx -p:Configuration=Debug -p:Platform=x64 -m:2 -nr:false -v:m -nologo 2>&1; $out | Select-String \" error |warning C\" | Select-Object -First 10; Get-ChildItem .\\Build\\x64\\Debug\\JBroEditorHost.exe, .\\Build\\x64\\Debug\\Localization\\ko-KR.yaml | Select-Object Name, LastWriteTime; Select-String -Path .\\Build\\x64\\Debug\\Localization\\ko-KR.yaml -Pattern \"canvas_view.lighting\" | Select-Object -First 1 | ForEach-Object Line", "ok": true}, {"k": "ai", "ts": "14:55", "t": "빌드가 오류·경고 없이 끝났고 번역 파일도 새로 들어갔습니다. 에디터를 원래처럼 인자 없이 다시 띄웁니다."}, {"k": "tool", "ts": "14:55", "t": "PowerShell $d = \"C:\\Users\\박주형\\Documents\\GitHub\\JBroEngine\\source\\JBroEngine\\Build\\x64\\Debug\"; $p = Start-Process -FilePath \"$d\\JBroEditorHost.exe\" -WorkingDirectory $d -PassThru; Start-Sleep -Seconds 6; \"pid $($p.Id) alive: $(-not $p.HasExited)\"", "ok": true}, {"k": "ai", "ts": "14:55", "t": "푸시, 빌드, 에디터 재실행까지 끝냈습니다.\n\n- **푸시**: origin/main 이 `1c5cdfdd` 에서 `c1f0f42e` 로 올라갔습니다. 다른 세션의 D-293~D-297 커밋도 함께 올라갔습니다.\n- **빌드**: 켜져 있던 에디터(PID 16856)를 닫고 솔루션 전체를 다시 빌드했습니다. 오류와 경고는 없습니다. 에디터 실행 파일과 번역 파일(새 \"라이팅\" 키 포함)이 새로 들어갔습니다.\n- **재실행**: 에디터를 원래처럼 인자 없이 다시 띄웠고, 지금 켜져 있습니다(PID 47320).\n\n**남은 것**\n- **알파 모양 그림자**: 외곽선을 어디에 저장할지와 새 모양 종류를 더할지 정해 주셔야 합니다.\n- **`Float` 이 `snprintf` 에 그대로 넘어가는 결함**: 캔버스 뷰 상태 줄 카메라 값이 깨지는 원인입니다. 따로 띄운 작업 칩에 있습니다.\n- **기존 열린 일**:\n  - `Text2DSystem` 의 `lit` 전달 시험\n  - 전역 컴포넌트 표에 무언가가 남는 문제(원인 미확인)\n  - 10초가 넘는 시험 둘\n- **위키와 구조 다이어그램(drawio)**: 라이팅 내용을 아직 넣지 않았습니다."}];
  // 실제 스킬: ~/.claude/skills. 기본 명령은 Claude Code 의 것 일부, tui 는 화면 없이는 못 하는 것
  const SKILLS = [["better-kor", "한국어로 말하고 쓸 때 쓴다. 번역투를 걷어내고 그 분야 한국 사람이 실제로 쓰는 말과 구조로 전달한다. 모드 인자로 성격을 바꾼다 — 인자 없음(그냥 제대로 된"], ["guigu-mod-codec", "Decode, re-encode, and audit 鬼谷八荒 (Tale of Immortal / 귀곡팔황) mod data files — ModExportData"], ["skill-creator", "Create new skills, modify and improve existing skills. Use when users want to create a ski"], ["sonmat-autoloop", "범용 자율 루프 — 기획→정의→실행→평가→판단→기록→반복. 에스컬레이션 판단 포함."], ["sonmat-devil", "Devil's advocate for reasoning — discovery-led counter-arguments against interpretations, "], ["sonmat-guard", "Main-side verification checks — pre-commit test / sensitive-file blocking, discipline conf"], ["sonmat-inspect", "Trigger-reactive discovery-led depth — when a System 1 signal surfaces (blast radius, shar"], ["sonmat-punch", "Punch list — completeness and residue check before delivery. Finds what's missing that sho"], ["sonmat-scribe", "Post-work persistence layer — observes completed work and writes what should outlive the s"]];
  const COMMANDS = [

  // 마크다운 조금: **굵게**, `코드`, - 목록, 빈 줄 문단
  function md(text) {
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    // 문단 안에 섞인 "- " 줄도 목록으로 묶는다
    return text.split(/\n{2,}/).map((block) => {
      let html = '', list = [], para = [];
      const flushList = () => { if (list.length) html += `<ul>${list.map((l) => `<li>${inline(l)}</li>`).join('')}</ul>`; list = []; };
      const flushPara = () => { if (para.length) html += `<p>${para.map(inline).join('<br>')}</p>`; para = []; };
      for (const line of block.split('\n')) {
        if (/^\s*- /.test(line)) { flushPara(); list.push(line.replace(/^\s*- /, '')); }
        else { flushList(); para.push(line); }
      }
      flushList(); flushPara();
      return html;
    }).join('');
  }
  const short = (t) => { const [name, ...rest] = t.split(' '); const arg = rest.join(' ').replace(/\s+/g, ' '); return [name, arg.length > 90 ? arg.slice(0, 90) + '…' : arg]; };

      group = null;
    };
    CHAT.forEach((m, i) => {
      if (m.k === 'tool') { group ??= []; group.push(m); if (m.ok === false) group.open = true; return; }
      flush();
      if (m.k === 'me') out.push(`<div class="msg me">${esc(m.t.trim())}</div>`);

    flush();
    if (state === 'ask') {

    }
    return out.join('');
  }

  }

  function page(state) {
    const working = state === 'ask';
    return `<div class="rooms"><button class="room-plus" type="button" title="새 터미널">${ic('plus-lg')}</button>
        <span class="room" aria-pressed="true"><span class="tool sm claude">C</span>에디터 빌드${working ? `<span class="hg" title="허락 기다림">${ic('hourglass-split')}</span>` : ''}<button class="icon-btn" type="button" style="width:22px;height:22px">${ic('x-lg')}</button></span>
        <span class="room"><span class="tool sm codex">X</span>레이어 선택<button class="icon-btn" type="button" style="width:22px;height:22px">${ic('x-lg')}</button></span></div>
      <div class="rtools">
        <span class="seg" style="margin-right:8px"><button type="button" aria-pressed="true">${ic('chat-dots')}말풍선</button><button type="button" aria-pressed="false">${ic('terminal')}터미널</button></span>
        <button class="icon-btn" type="button" title="찾기">${ic('search')}</button><span class="sep"></span>
        <button class="icon-btn" type="button" title="파일 첨부">${ic('paperclip')}</button>
        <button class="icon-btn" type="button" title="폴더 열기">${ic('folder2-open')}</button>
        <button class="icon-btn" type="button" title="더보기">${ic('three-dots')}</button>
        <span class="title ell">Claude Code · JBroEngine — 에디터 빌드 ${working ? '<span class="pill warn">허락 기다림</span>' : '<span class="pill">답 끝남</span>'}</span>
      </div>
      <div class="chat"><div class="msgs" id="msgs">${msgs(state)}</div>
        <div class="composer">${state === 'cmd' ? cmdPop() : ''}
          <div class="compose-box ${state === 'cmd' ? 'focus' : ''}"><button class="icon-btn" type="button" title="파일 첨부">${ic('paperclip')}</button>
            ${state === 'cmd' ? '<span class="text">/</span>' : '<span class="text ph">Claude 에게 보낼 말 · / 를 치면 명령과 스킬</span>'}
            <button class="send" type="button" title="보내기 (Enter)">${ic('send-fill')}</button></div>
          <div class="compose-hint"><span>Enter 보내기 · Shift+Enter 줄바꿈</span><span>보낸 글은 이 방의 Claude 입력 줄로 들어갑니다</span></div>
        </div></div>`;
  }

  const DESC = {
    chat: '<b>말풍선</b> — 이 PC 의 실제 Claude 세션 끝부분입니다. 도구를 잇달아 쓴 곳은 한 줄로 접고(누르면 펼침, 한 곳은 펼쳐 둠), 실패한 도구는 빨갛게 셉니다.',
    cmd: '<b>/ 목록</b> — 입력칸에 / 를 치면 바로 위에 뜹니다. 내 스킬은 ~/.claude/skills 의 실제 9개. 화면이 있어야 하는 명령(/login 등)은 고르면 터미널 보기로 넘어갑니다.',
    ask: '<b>허락 기다림</b> — 아래 두 말풍선과 허락 요청은 <b>예시</b>입니다(지금 허락을 기다리는 방이 없어서). 허락은 CLI 화면에서 답하므로 단추가 터미널 보기로 넘깁니다.',
  };
  const q = new URLSearchParams(location.search);
  let state = q.get('v') || 'chat';
  function show() {
    document.getElementById('main').innerHTML = page(state);
    document.getElementById('desc').innerHTML = DESC[state] + ' <span class="faint">방 띠의 두 번째 방 이름은 예시입니다.</span>';
    document.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state)));
    const m = document.getElementById('msgs'); m.scrollTop = m.scrollHeight;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) { state = b.dataset.v; show(); }
    if (b.dataset.w) { document.getElementById('frame').classList.toggle('narrow', b.dataset.w === '960'); b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); show(); }
    if (b.dataset.th) { document.documentElement.dataset.theme = b.dataset.th; b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }
  });
  if (q.get('w') === '960') document.getElementById('frame').classList.add('narrow');
  if (q.get('th') === 'dark') document.documentElement.dataset.theme = 'dark';
  show();
})();
</script>
</body>
</html>
